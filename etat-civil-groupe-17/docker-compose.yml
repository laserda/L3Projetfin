services:
  beautyconnect-pgadmin:
    image: dpage/pgadmin4:9
    container_name: beautyconnect-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?email manquante}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?password manquante}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/misc/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  nextjs:
    container_name: etat_civil_web
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_KEY: ${NEXT_PUBLIC_KEY:-}
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL manquante}
      NODE_ENV: production
      CITOYEN_SESSION_SECRET: ${CITOYEN_SESSION_SECRET}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
